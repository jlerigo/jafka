tasks:
    build-project:
        name: Build Kafka
        command: ./gradlew jar
        triggeredBy:
            - postDevcontainerStart
            - manual
    
    clean-build:
        name: Clean and Build
        command: ./gradlew clean jar
        triggeredBy:
            - manual
    
    run-tests:
        name: Run Unit Tests
        command: ./gradlew unitTest
        triggeredBy:
            - manual
    
    run-integration-tests:
        name: Run Integration Tests
        command: ./gradlew integrationTest
        triggeredBy:
            - manual
    
    run-all-tests:
        name: Run All Tests
        command: ./gradlew test
        triggeredBy:
            - manual
    
    build-source-jar:
        name: Build Source JAR
        command: ./gradlew srcJar
        triggeredBy:
            - manual
    
    generate-docs:
        name: Generate Documentation
        command: ./gradlew aggregatedJavadoc
        triggeredBy:
            - manual
    
    code-quality-check:
        name: Run Code Quality Checks
        command: ./gradlew checkstyleMain checkstyleTest spotlessCheck
        triggeredBy:
            - manual
    
    list-gradle-tasks:
        name: List All Gradle Tasks
        command: ./gradlew tasks
        triggeredBy:
            - manual