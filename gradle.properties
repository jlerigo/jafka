# Create a minimal gradle.properties
cat > gradle.properties << 'EOF'
# Set Java home for Gradle
org.gradle.java.home=/usr/lib/jvm/msopenjdk-current

# Project version (required for archive tasks)
version=4.2.0-SNAPSHOT

# Gradle settings
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
javadoc.failOnError=false

# Build settings
ignoreFailures=false
maxParallelForks=9
maxScalacThreads=8
maxTestRetries=0
EOF

# Test it
./gradlew help